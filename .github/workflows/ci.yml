name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 默认 cp1252, 中文审计输出会 UnicodeEncodeError; 全局 UTF-8。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, numpy-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run pytest
        run: python -m pytest -q

      - name: Layering audit (INV-41)
        run: python scripts/check_layering.py

      - name: No-reinvention audit (INV-42)
        run: python scripts/audit_no_reinvention.py

      - name: Docs check (R-X-03)
        run: python scripts/check_docs.py

  baseline:
    name: performance baseline (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (editable, numpy-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate baseline (CPU)
        run: python scripts/gen_baseline.py

      - name: Upload BASELINE.md artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: BASELINE.md

  coverage:
    name: coverage (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (editable, numpy-only + pytest-cov)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      - name: Run coverage (report-only, no gate)
        run: python -m pytest -q --cov=ifai --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
